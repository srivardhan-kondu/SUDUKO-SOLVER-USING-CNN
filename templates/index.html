<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku Solver</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <header>
        <h1>Sudoku Solver using Neural Networks</h1>
    </header>
    <main>
        <div class="form-container">
            <form action="/upload" method="POST" enctype="multipart/form-data">
                <label for="file-upload">Choose your Sudoku image:</label>
                <input type="file" id="file-upload" name="file" accept="image/*" required>
                <button type="submit">Solve Sudoku</button>
            </form>
        </div>
    </main>

    <footer>
        <p>Project by Srivardhan</p>
    </footer>
</body>
</html>
